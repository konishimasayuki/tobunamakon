name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # 伝票書き込みは必ず saveShipmentHash / removeShipment を通す規約（版番号INCR漏れ＝掲示板の取りこぼし防止）
      - name: 伝票書き込み規約チェック
        run: node scripts/check-shipment-writes.mjs
      - name: ビルド（型チェック＋フロントビルド）
        run: npm run build
